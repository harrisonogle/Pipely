\* Splice-ordering experiment configuration for Publication.tla.
\*
\* Run with:  tlc -config Publication_Reversed.cfg Publication.tla
\*
\* Expected outcome: TLC finds a counterexample to ChainConsistent, showing
\* the race where the reader observes a non-null state.Tail whose segment
\* is not yet reachable from state.Head (or prevTail.Next on a subsequent
\* splice).  This confirms §6.4.2's "CRITICAL ORDERING" argument is
\* load-bearing on weak memory.

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    MaxSegments           = 3
    MaxChainLen           = 2
    ENABLE_ORDERED_SPLICE = FALSE

INVARIANTS
    TypeOK
    ChainConsistent
    NoRetiredAsPrevTail
    BWPNotAheadOfTail
    ReaderHeadNotRetired
    ExaminedNotAhead

PROPERTIES
    EventualWriterHalt
    EventualReaderHalt
