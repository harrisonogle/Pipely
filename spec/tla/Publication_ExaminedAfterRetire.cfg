\* Differential experiment: compute examined *after* the retire walk instead of
\* before (§7.3 errata is disabled).  Expected: NoStaleFieldReadAfterRetire
\* violated when the retire walk puts examinedSeg into the pool and the writer
\* re-rents it, so the subsequent snapshot of examinedSeg.RunningIndex reads
\* fields from a different logical segment than the reader originally observed.
SPECIFICATION Spec

CONSTANTS
    MaxSegments            = 3
    MaxChainLen            = 2
    MaxAdvanceCycles       = 2
    MaxSpliceCycles        = 2
    EnableOrderedSplice    = TRUE
    EnableExaminedSnapshot = FALSE

INVARIANTS
    TypeOK
    ChainConsistent
    NoRetiredAsPrevTail
    ReaderHeadNotRetired
    BWPNotAheadOfTail
    NoStaleFieldReadAfterRetire
    BytesReadConsistent
