\* Differential experiment: drop the writer-side fence in §8.2.  Expected:
\* lost-wakeup counterexample — reader parks on stale tailPublished while
\* writer's store is still in bufW, writer's signal-check sees Idle, and
\* the store drains too late to wake the reader.  EventuallyResumed fails.
SPECIFICATION Spec

CONSTANTS
    Results      = {"ReadSig"}
    Exceptions   = {"Ex"}
    Callbacks    = {"readerCb"}
    MaxResets    = 2

    MaxProduces  = 2
    MaxCancels   = 1
    EnableWriterFence = FALSE

INVARIANTS
    TypeOK
    NoSpuriousWake

PROPERTIES
    EventuallyReaderFinishesArm
    EventuallyResumed
