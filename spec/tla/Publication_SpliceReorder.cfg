\* Differential experiment: flip the splice release-store order.  The writer
\* emits Part2 (state.Tail = unpubTail) BEFORE Part1 (state.Head / prevTail.Next).
\* Expected: ChainConsistent violated — a reader can acquire-load memTail pointing
\* into the chain while memHead (or prevTail.Next) still points past it, so the
\* reader's first-read traversal breaks.
SPECIFICATION Spec

CONSTANTS
    MaxSegments            = 3
    MaxChainLen            = 2
    MaxAdvanceCycles       = 2
    MaxSpliceCycles        = 2
    EnableOrderedSplice    = FALSE
    EnableExaminedSnapshot = TRUE

INVARIANTS
    TypeOK
    ChainConsistent
    NoRetiredAsPrevTail
    ReaderHeadNotRetired
    BWPNotAheadOfTail
    NoStaleFieldReadAfterRetire
    BytesReadConsistent
