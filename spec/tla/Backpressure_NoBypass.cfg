\* Differential: EnableHysteresisBypass=FALSE drops the reader-complete
\* bypass.  Expected: NoLostWakeupOnReaderComplete fails when writer is
\* parked with Outstanding >= Resume and reader completes — writer stays
\* parked forever.
SPECIFICATION Spec

CONSTANTS
    Results      = {"FlushRes"}
    Exceptions   = {"Ex"}
    Callbacks    = {"writerCb"}
    MaxResets    = 2

    Pause        = 4
    Resume       = 2
    ChunkSize    = 1
    MaxProduces  = 5
    MaxConsumes  = 5
    EnableReaderFence       = TRUE
    EnableHysteresisBypass  = FALSE
    EnableResumeHysteresis  = TRUE

INVARIANTS
    TypeOK
    HysteresisCorrectness

PROPERTIES
    NoLostWakeupOnReaderComplete
