\* Differential experiment: drop the Reset-discipline guard (EnforceResetDiscipline=FALSE).
\* Reset may now fire while a continuation is still registered but undispatched,
\* stranding the continuation. Expect ResetDiscipline invariant to fail
\* (dangling registered continuations whose token < current version and that
\* were never dispatched).
SPECIFICATION Spec

CONSTANTS
    Results       = {"R0", "R1"}
    Exceptions    = {"E0"}
    Callbacks     = {"cb0"}
    MaxResets     = 2
    MaxCompletes  = 3
    EnforceResetDiscipline = FALSE

INVARIANTS
    TypeOK
    VersionBounded
    ResetDiscipline
    NoOrphanDispatch
