\* Fence-removal experiment configuration for AwaiterHandshake.tla.
\*
\* Run with:  tlc -config AwaiterHandshake_NoFence.cfg AwaiterHandshake.tla
\*
\* Expected outcome: TLC finds a counterexample to the EventuallyUnArmed /
\* EventualProgress temporal properties showing the classic lost-wakeup race
\* (see README).  This confirms §8.2's Interlocked.MemoryBarrier() is
\* load-bearing on weak-memory hardware.

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    MaxProduces         = 2
    MaxArms             = 2
    MaxCancels          = 1
    ENABLE_WRITER_FENCE = FALSE

INVARIANTS
    TypeOK
    AtMostOneResult
    AwaiterHasVersion
    ParkedImpliesNonIdle

PROPERTIES
    EventuallyUnArmed
    EventuallyResumed
    EventualProgress
