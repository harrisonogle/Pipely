SPECIFICATION Spec

CONSTANTS
    MaxSegments            = 3
    MaxChainLen            = 2
    MaxAdvanceCycles       = 2
    MaxSpliceCycles        = 2
    EnableOrderedSplice    = TRUE
    EnableExaminedSnapshot = TRUE

INVARIANTS
    TypeOK
    ChainConsistent
    NoRetiredAsPrevTail
    ReaderHeadNotRetired
    BWPNotAheadOfTail
    NoStaleFieldReadAfterRetire
    BytesReadConsistent

\* Deadlock is expected once the writer halts with the buffer still needing
\* to drain + reader halts.  Disable deadlock checking since we're modelling
\* a concurrent system that can quiesce.
