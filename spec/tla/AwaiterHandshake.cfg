\* TLC configuration for AwaiterHandshake.tla
\*
\* Default: correct model (writer fence enabled).  TLC should verify all
\* invariants and temporal properties.  To run the fence-removal experiment,
\* flip ENABLE_WRITER_FENCE to FALSE and expect EventuallyUnArmed (or the
\* stronger EventualProgress) to fail with a lost-wakeup counterexample.

SPECIFICATION Spec

\* All three actors terminate deterministically (Halt states).  Without this
\* flag TLC reports terminal states as deadlocks; the spec's temporal
\* properties still enforce liveness via weak fairness.
CHECK_DEADLOCK FALSE

CONSTANTS
    MaxProduces         = 2
    MaxArms             = 2
    MaxCancels          = 1
    ENABLE_WRITER_FENCE = TRUE

INVARIANTS
    TypeOK
    AtMostOneResult
    AwaiterHasVersion
    ParkedImpliesNonIdle

PROPERTIES
    EventuallyUnArmed
    EventuallyResumed
    EventualProgress
