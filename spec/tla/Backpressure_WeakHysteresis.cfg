\* Differential: EnableResumeHysteresis=FALSE uses Pause instead of Resume
\* as the signal threshold.  Expected: HysteresisCorrectness fails —
\* writer gets woken at Outstanding ≈ Pause-1 (premature wake), producing
\* wake-park thrash.
SPECIFICATION Spec

CONSTANTS
    Results      = {"FlushRes"}
    Exceptions   = {"Ex"}
    Callbacks    = {"writerCb"}
    MaxResets    = 2

    Pause        = 4
    Resume       = 2
    ChunkSize    = 1
    MaxProduces  = 5
    MaxConsumes  = 5
    EnableReaderFence       = TRUE
    EnableHysteresisBypass  = TRUE
    EnableResumeHysteresis  = FALSE

INVARIANTS
    TypeOK
    HysteresisCorrectness
