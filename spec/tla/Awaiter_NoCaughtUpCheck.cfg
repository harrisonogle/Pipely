\* Differential experiment: drop the §8.2.1 reader-caught-up check.
\* Expected: NoSpuriousWake violated — the writer signals based on an
\* already-consumed publish, and the reader's GetResult re-run finds
\* nothing past examined, no completion, no cancellation.
SPECIFICATION Spec

CONSTANTS
    Results      = {"ReadSig"}
    Exceptions   = {"Ex"}
    Callbacks    = {"readerCb"}
    MaxResets    = 2

    MaxProduces  = 2
    MaxCancels   = 1
    EnableWriterFence         = TRUE
    EnableReaderCaughtUpCheck = FALSE

INVARIANTS
    TypeOK
    NoSpuriousWake
